[workspace]
resolver = "2"
members = [
    "dcp-types",
    "dcpd",
    "dcp-cli",
    "plugins/dcp-plugin-sdk",
    "plugins/example-plugin",
    "plugins/browser-plugin",
    "sdks/rust/dcp-client",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/dcp"
homepage = "https://github.com/your-org/dcp"
readme = "README.md"
keywords = ["desktop", "context", "wayland", "hyprland", "json-rpc", "mcp"]
categories = ["api-bindings", "command-line-utilities", "os"]

[workspace.dependencies]
# Shared across workspace
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
anyhow = "1"
futures = "0.3"

# Internal crates
dcp-types = { path = "dcp-types" }
